<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meshy / Tripo3D To STL</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Meshy / Tripo3D To STL</h1>
        <button id="scan" type="button" title="Refresh current tab scan">Refresh</button>
      </header>

      <div id="links" role="listbox" aria-label="Arquivos encontrados"></div>

      <div id="preview" hidden>
        <img id="preview-image" alt="Preview do recurso selecionado">
        <span id="preview-empty">Passe o mouse sobre um link para visualizar.</span>
      </div>

      <label for="url-input">URL direta do modelo</label>
      <div class="url-row">
        <input id="url-input" type="url" placeholder="https://.../model.glb" autocomplete="off">
        <button id="download-url" type="button">Baixar URL</button>
      </div>

      <label for="format">Output format</label>
      <select id="format">
        <option value="stl">STL (3D printing)</option>
        <option value="obj">OBJ (3D editors)</option>
        <option value="obj-package">OBJ + MTL + textures + UV</option>
        <option value="glb">GLB (original decoded model)</option>
      </select>

      <div class="row">
        <button id="convert" type="button">Download STL</button>
      </div>

      <progress id="progress" hidden></progress>
      <p id="status">Ready.</p>
    </main>

    <iframe id="sandbox" src="sandbox.html" hidden></iframe>
    <script src="popup.js"></script>
  </body>
</html>
